name: Release Please

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/docs/**'
      - 'test/**'
      - 'tests/**'
      - '**/test/**'
      - '**/tests/**'
      - '**/*.test.*'
      - '**/*.spec.*'
      - '.github/**'
      - 'release-please-config.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout the released revision
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - name: Install Bun
        if: ${{ steps.release.outputs.release_created }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify the release
        if: ${{ steps.release.outputs.release_created }}
        run: |
          bun run typecheck
          bun run test
          bun pm pack --dry-run

      - name: Verify the released version
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          echo "tag: $TAG   package.json: $version"
          test "$TAG" = "v${version}"

      - name: Set up Node for the npm client
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # No token and no --provenance flag. Trusted publishing authenticates
      # over OIDC and attests provenance by itself, given a public repo and a
      # public package. The trusted publisher on npmjs.com is bound to this
      # workflow's filename, so moving this step to another file breaks it.
      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish --ignore-scripts
